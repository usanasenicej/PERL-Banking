<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usanase Banking</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="view active">
            <div class="auth-container">
                <div class="logo">🏦 Usanase Banking</div>
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchAuthTab('register')">Register</button>
                </div>
                
                <form id="login-form" class="auth-form active">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="primary-btn">Sign In</button>
                    <div class="error-msg" id="login-error"></div>
                </form>

                <form id="register-form" class="auth-form">
                    <input type="text" id="reg-username" placeholder="Username" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Password" required>
                    <button type="submit" class="primary-btn">Create Account</button>
                    <div class="error-msg" id="reg-error"></div>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <nav class="navbar">
                <div class="logo">🏦 Usanase Banking</div>
                <div class="user-profile">
                    <span id="welcome-msg"></span>
                    <button onclick="logout()" class="logout-btn">Logout</button>
                </div>
            </nav>

            <main class="dashboard-content">
                <div class="grid-layout">
                    <!-- Accounts Panel -->
                    <section class="panel">
                        <h2>Your Accounts</h2>
                        <div id="accounts-list" class="card-list"></div>
                        <div class="action-bar">
                            <button class="secondary-btn" onclick="showModal('create-account-modal')">+ New Account</button>
                        </div>
                    </section>
                    
                    <!-- Transactions Panel -->
                    <section class="panel">
                        <h2>Actions</h2>
                        <div class="quick-actions">
                            <button class="action-btn" onclick="showModal('deposit-modal')">Deposit</button>
                            <button class="action-btn" onclick="showModal('withdraw-modal')">Withdraw</button>
                            <button class="action-btn" onclick="showModal('transfer-modal')">Transfer</button>
                            <button class="action-btn" onclick="showModal('loan-modal')">Apply for Loan</button>
                        </div>
                        <h2 class="mt-2">Loans</h2>
                        <div id="loans-list" class="card-list"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="create-account-modal" class="modal">
        <div class="modal-content">
            <h3>Open New Account</h3>
            <select id="new-account-type">
                <option value="checking">Checking</option>
                <option value="savings">Savings</option>
            </select>
            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeModal('create-account-modal')">Cancel</button>
                <button class="primary-btn" onclick="createAccount()">Open</button>
            </div>
        </div>
    </div>

    <div id="deposit-modal" class="modal">
        <div class="modal-content">
            <h3>Deposit Funds</h3>
            <select id="deposit-account" class="account-dropdown"></select>
            <input type="number" id="deposit-amount" placeholder="Amount" step="0.01">
            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeModal('deposit-modal')">Cancel</button>
                <button class="primary-btn" onclick="submitDeposit()">Confirm</button>
            </div>
        </div>
    </div>

    <div id="withdraw-modal" class="modal">
        <div class="modal-content">
            <h3>Withdraw Funds</h3>
            <select id="withdraw-account" class="account-dropdown"></select>
            <input type="number" id="withdraw-amount" placeholder="Amount" step="0.01">
            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeModal('withdraw-modal')">Cancel</button>
                <button class="primary-btn" onclick="submitWithdraw()">Confirm</button>
            </div>
        </div>
    </div>

    <div id="transfer-modal" class="modal">
        <div class="modal-content">
            <h3>Transfer Funds</h3>
            <select id="transfer-from" class="account-dropdown"></select>
            <input type="number" id="transfer-to" placeholder="Destination Account ID">
            <input type="number" id="transfer-amount" placeholder="Amount" step="0.01">
            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeModal('transfer-modal')">Cancel</button>
                <button class="primary-btn" onclick="submitTransfer()">Transfer</button>
            </div>
        </div>
    </div>
    
    <div id="loan-modal" class="modal">
        <div class="modal-content">
            <h3>Apply for a Loan</h3>
            <input type="number" id="loan-amount" placeholder="Amount" step="0.01">
            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeModal('loan-modal')">Cancel</button>
                <button class="primary-btn" onclick="submitLoan()">Apply</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
